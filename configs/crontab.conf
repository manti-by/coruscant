# Update everything on restart
@reboot           /home/manti/www/coruscant/run.sh pumps
@reboot           /home/manti/www/coruscant/run.sh sensors
@reboot           /home/manti/www/coruscant/run.sh servos

# Every 10 minutes
0-59/10 * * * *   /home/manti/www/coruscant/run.sh pumps

# Every 5 minutes (with offset +1 minute)
1-59/5 * * * *     /home/manti/www/coruscant/run.sh sensors

# Every 15 minutes (with offset +3/+5 minutes)
3-59/15 * * * *    /home/manti/www/coruscant/run.sh servos
5-59/15 * * * *    /home/manti/www/coruscant/run.sh valve
